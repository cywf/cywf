name: Refresh public profile sections

on:
  workflow_dispatch:
  schedule:
    - cron: '10 10 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-public-profile-sections
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh README dynamic sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run profile:update

      - name: Validate README structure
        run: npm run profile:validate

      - name: Update timestamps
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          sed -i "s|<!-- UPDATE_TIME -->.*<!-- /UPDATE_TIME -->|<!-- UPDATE_TIME -->$TIMESTAMP<!-- /UPDATE_TIME -->|g" README.md
          sed -i "s|<!-- LAST_SYNC -->.*<!-- /LAST_SYNC -->|<!-- LAST_SYNC -->$TIMESTAMP<!-- /LAST_SYNC -->|g" README.md

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/gists-history.json scripts/publicRepoData.mjs scripts/updateOverview.mjs scripts/updateProjectMatrix.mjs scripts/updateLearning.mjs scripts/updateTrending.mjs scripts/validateReadme.mjs package.json
          if git diff --cached --quiet; then
            echo "No profile-section changes detected"
            exit 0
          fi
          git commit -m "ci(profile): refresh public repo overview and showcase [skip ci]"
          git push
