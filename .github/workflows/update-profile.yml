name: Update profile sections

on:
  workflow_dispatch:
  schedule:
    - cron: '10 10 * * *'

permissions:
  contents: write

concurrency:
  group: update-profile-sections
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh latest posts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/updateGists.mjs

      - name: Refresh repository map
        run: node scripts/buildRepoMermaid.mjs

      - name: Refresh learning section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/updateLearning.mjs || true

      - name: Refresh showcase section
        run: node scripts/updateTrending.mjs || true

      - name: Validate README structure
        run: node scripts/validateReadme.mjs

      - name: Update timestamp
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          sed -i "s|<!-- UPDATE_TIME -->.*<!-- /UPDATE_TIME -->|<!-- UPDATE_TIME -->$TIMESTAMP<!-- /UPDATE_TIME -->|g" README.md

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No profile-section changes detected"
            exit 0
          fi
          git commit -m "ci(profile): refresh README dynamic sections [skip ci]"
          git push
