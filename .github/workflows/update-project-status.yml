name: Refresh project status matrix

on:
  schedule:
    - cron: '20 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-project-matrix
  cancel-in-progress: false

jobs:
  update-project-status:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh system overview and matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/updateOverview.mjs
          node scripts/updateProjectMatrix.mjs

      - name: Validate README structure
        run: node scripts/validateReadme.mjs

      - name: Update timestamp
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          sed -i "s|<!-- UPDATE_TIME -->.*<!-- /UPDATE_TIME -->|<!-- UPDATE_TIME -->$TIMESTAMP<!-- /UPDATE_TIME -->|g" README.md

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md scripts/publicRepoData.mjs scripts/updateOverview.mjs scripts/updateProjectMatrix.mjs scripts/validateReadme.mjs
          if git diff --cached --quiet; then
            echo "No project-matrix changes detected"
            exit 0
          fi
          git commit -m "ci: refresh system overview and project matrix [skip ci]"
          git push
