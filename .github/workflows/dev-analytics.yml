name: Dev Analytics (json-render)

# G8S TID-129 — refresh the Developer Analytics card on the profile README.
on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "dev-analytics/**"
      - ".github/workflows/dev-analytics.yml"

permissions:
  contents: write

concurrency:
  group: dev-analytics
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        working-directory: dev-analytics
        run: npm install --no-audit --no-fund
      - name: Generate analytics
        working-directory: dev-analytics
        env:
          GH_USERNAME: cywf
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run generate
      - name: Commit refreshed analytics
        run: |
          git config user.name "g8s-doc-keeper"
          git config user.email "actions@users.noreply.github.com"
          git add dev-analytics/dev-analytics.svg README.md
          if git diff --staged --quiet; then
            echo "No analytics changes."
          else
            git commit -m "chore(analytics): refresh developer analytics [skip ci]"
            git push
          fi
