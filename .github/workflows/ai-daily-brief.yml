name: Update Daily Brief

on:
  schedule:
    - cron: '50 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-daily-brief
  cancel-in-progress: false

jobs:
  update-daily-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh Daily Brief
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/updateDailyBrief.mjs

      - name: Validate README structure
        run: node scripts/validateReadme.mjs

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md daily
          if git diff --cached --quiet; then
            echo "No Daily Brief changes detected"
            exit 0
          fi
          git commit -m "ci: refresh daily brief [skip ci]"
          git push
