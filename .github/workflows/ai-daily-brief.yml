name: Refresh public repo overview

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-overview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh overview, matrix, learning, and showcase
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run profile:update

      - name: Validate README structure
        run: npm run profile:validate

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/gists-history.json
          if git diff --cached --quiet; then
            echo "No public-overview changes detected"
            exit 0
          fi
          git commit -m "ci: refresh public repo overview [skip ci]"
          git push
